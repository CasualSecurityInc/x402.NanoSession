name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Create redirect page
        run: |
          mkdir -p site/gen/dist
          cat > site/gen/dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="3; url=https://csi.ninzin.net/x402.Nano/">
            <title>x402.NanoSession has moved to x402.Nano</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e4e4e7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
              .container { text-align: center; padding: 2rem; max-width: 480px; }
              h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: #fff; }
              p { font-size: 1rem; line-height: 1.6; color: #a1a1aa; margin-bottom: 1.5rem; }
              a { color: #22d3ee; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .url { font-family: monospace; font-size: 0.875rem; word-break: break-all; }
              .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #3f3f46; border-top-color: #22d3ee; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>x402.NanoSession has moved</h1>
              <p>This documentation has been consolidated into <strong>x402.Nano</strong>. You will be redirected automatically in 3 seconds.</p>
              <p><a href="https://csi.ninzin.net/x402.Nano/"><span class="spinner"></span>Redirect now</a></p>
              <p class="url">https://csi.ninzin.net/x402.Nano/</p>
            </div>
            <script>window.location.replace("https://csi.ninzin.net/x402.Nano/")</script>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/gen/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
